[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-noob-toolkit"
version = "1.0.0"
description = "Automated protective shield & friendly copilot for beginners and vibe coders."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GitHub Noob Toolkit Core Team", email = "hello@gnt-shield.dev" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "stripe>=8.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
